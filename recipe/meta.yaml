{% set name = "oci" %}
{% set version = "2.184.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/oci-{{ version }}.tar.gz
  sha256: 19742d0fdd27947daafd2cfea4db31ad585fde379094f41ddb7280109939210e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >70.0.0
  run:
    - python >={{ python_min }}
    - certifi
    - cryptography >=3.2.1,<50.0.0
    - pyopenssl >=17.5.0,<27.0.0
    - python-dateutil >=2.5.3,<3.0.0
    - pytz >=2016.10
    - circuitbreaker >=1.3.1,<3.0.0
    - urllib3 >=2.6.3
    - pyjwt >=2.12.0
    - crc32c ==2.8.0

test:
  imports:
    - oci
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://docs.oracle.com/en-us/iaas/tools/python/latest/index.html
  summary: Oracle Cloud Infrastructure Python SDK
  license: Apache-2.0 OR UPL-1.0
  license_file: LICENSE.txt
  dev_url: https://github.com/oracle/oci-python-sdk

extra:
  recipe-maintainers:
    - manics
